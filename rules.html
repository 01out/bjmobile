<script data-page-node-id="7v6R11cDvcehoenRCuz8wp" data-pnid-children="FlNdoVJRwmSLySl23uqTLH">
/* ============ 访问控制：仅维护者手机号查询后可用 ============ */
const OWNER_PHONE='17600799221';
const KEY_Q='arpu_last_query';
const KEY_R='arpu_rules_v1';
const KEY_S='arpu_series_v1';
const KEY_BIZ='arpu_business_v1';
const DEFAULT_SERIES='default';
const CAT_NAME={consume:'凑单消费类',welfare:'条件福利类'};

const $=id=>document.getElementById(id);
let rules=[],series=[],editingId=null,seriesFilter='',renamingSeriesId=null,addingSeries=false,catFilter='',srcFilter='';
const PAGE_SIZE=20;   // 分页：每页 20 条
let pageRule=1;       // 规则列表当前页

/* ============ 分页插件（最简：共 N 条数据 + 页码） ============ */
function renderPager(el,total,page,onPage){
  if(!el)return;
  if(!total){el.innerHTML='';el.classList.add('hidden');return}
  el.classList.remove('hidden');
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(page>pages)page=pages;
  let nums=[];
  if(pages<=7){for(let i=1;i<=pages;i++)nums.push(i)}
  else{
    nums.push(1);
    const lo=Math.max(2,page-1),hi=Math.min(pages-1,page+1);
    if(lo>2)nums.push('…');
    for(let i=lo;i<=hi;i++)nums.push(i);
    if(hi<pages-1)nums.push('…');
    nums.push(pages);
  }
  el.innerHTML=`<span class="pg-info">共 ${total} 条数据</span><span class="pg-btns">`
    +`<button type="button" class="pg-btn" data-pg="${page-1}"${page<=1?' disabled':''}>‹</button>`
    +nums.map(n=>n==='…'?'<span class="pg-dots">…</span>':`<button type="button" class="pg-btn num${n===page?' active':''}" data-pg="${n}">${n}</button>`).join('')
    +`<button type="button" class="pg-btn" data-pg="${page+1}"${page>=pages?' disabled':''}>›</button></span>`;
  el._onPage=onPage;
}
function bindPager(el){
  if(!el||el._pagerBound)return;
  el._pagerBound=true;
  el.addEventListener('click',e=>{
    const b=e.target.closest('.pg-btn');
    if(!b||b.disabled||!el._onPage)return;
    el._onPage(Number(b.dataset.pg));
  });
}

function accessDenied(){
  $('mainView').style.display='none';
  document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden'));
  $('denyView').style.display='flex';
}
function checkAccess(){
  let q='';try{q=localStorage.getItem(KEY_Q)||''}catch(e){}
  if(q!==OWNER_PHONE){accessDenied();return false}
  return true;
}

/* ============ 通用 UI ============ */
let toastTimer=null;
function toast(msg){
  const el=$('toast');if(!el)return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let cfCallback=null;
function askConfirm(msg,onOk,opts){
  opts=opts||{};
  $('cfTitle').textContent=opts.title||'删除确认';
  $('cfMsg').textContent=msg;
  $('cfOk').textContent=opts.okText||'删除';
  $('cfOk').className=opts.okClass!==undefined?opts.okClass:'danger';
  cfCallback=onOk||null;
  $('confirmModal').classList.remove('hidden');
}
function closeConfirm(){$('confirmModal').classList.add('hidden');cfCallback=null}
function showInfo(title,msg){
  $('infoTitle').textContent=title;
  $('infoMsg').textContent=msg;
  $('infoModal').classList.remove('hidden');
}
function closeInfo(){$('infoModal').classList.add('hidden')}
$('infoOk').addEventListener('click',closeInfo);
$('infoClose').addEventListener('click',closeInfo);
$('infoModal').addEventListener('click',e=>{if(e.target===$('infoModal'))closeInfo()});
$('cfOk').addEventListener('click',()=>{const cb=cfCallback;closeConfirm();if(cb)cb()});
$('cfCancel').addEventListener('click',closeConfirm);
$('confirmModal').addEventListener('click',e=>{if(e.target===$('confirmModal'))closeConfirm()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('confirmModal').classList.contains('hidden')){closeConfirm();return}
  if(!$('infoModal').classList.contains('hidden')){closeInfo();return}
  if(!$('modal').classList.contains('hidden'))closeForm();
});

/* ============ 数据读写 ============ */
function cleanName(s){return String(s==null?'':s).replace(/[\u200B-\u200D\uFEFF]/g,'').trim()}
function loadSeries(){
  try{series=JSON.parse(localStorage.getItem(KEY_S)||'null')}catch(e){series=null}
  if(!Array.isArray(series))series=[];
  series=series.filter(s=>s&&typeof s==='object'&&s.name&&s.id!==undefined);
  if(!series.some(s=>s.id===DEFAULT_SERIES))series.unshift({id:DEFAULT_SERIES,name:'默认系列',createdAt:0,updatedAt:0});
  persistSeries();
}
function persistSeries(){try{localStorage.setItem(KEY_S,JSON.stringify(series))}catch(e){alert('本地保存失败：浏览器存储空间可能已满')}}
function seriesName(id){const s=series.find(x=>x.id===id);return s?s.name:'默认系列'}
function loadRules(){
  loadSeries();
  try{rules=JSON.parse(localStorage.getItem(KEY_R)||'[]')}catch(e){rules=[]}
  if(!Array.isArray(rules))rules=[];
  rules=rules.filter(x=>x&&typeof x==='object'&&(x.code||x.shortName||x.name)).map(x=>{
    const cat=(x.category==='consume'||x.category==='welfare')?x.category:'consume';
    const sid=series.some(s=>s.id===x.seriesId)?x.seriesId:DEFAULT_SERIES;
    return {...x,shortName:cleanName(x.shortName)||cleanName(x.name),name:cleanName(x.name),code:cleanName(x.code),category:cat,seriesId:sid,liability:x.liability||''};
  });
}
function persist(){try{localStorage.setItem(KEY_R,JSON.stringify(rules))}catch(e){alert('本地保存失败：浏览器存储空间可能已满')}}
// 已认领计数（business 页通过业务编码关联；业务数据按手机号分桶，聚合所有号码）
function allBizItems(){
  let arr=[];
  try{
    const m=JSON.parse(localStorage.getItem('arpu_business_v2')||'{}');
    if(m&&typeof m==='object'&&!Array.isArray(m))Object.values(m).forEach(b=>{if(Array.isArray(b))arr=arr.concat(b)});
  }catch(e){}
  let old=[];try{old=JSON.parse(localStorage.getItem(KEY_BIZ)||'[]')}catch(e){}
  if(Array.isArray(old))arr=arr.concat(old);
  return arr;
}
function claimedCount(code){
  return allBizItems().filter(x=>x&&x.code===code).length;
}

/* ============ 资费系列（完整管理） ============ */
function syncSeriesSelect(){
  const sel=$('fSeries'),cur=sel.value;
  sel.innerHTML=series.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  sel.value=series.some(s=>s.id===cur)?cur:DEFAULT_SERIES;
}
function renderSeries(){
  const counts={};
  rules.forEach(x=>{const k=x.seriesId||DEFAULT_SERIES;counts[k]=(counts[k]||0)+1});
  let html=series.map(s=>{
    const c=counts[s.id]||0,isDef=s.id===DEFAULT_SERIES;
    if(renamingSeriesId===s.id){
      return `<span class="stag renaming" data-sid="${s.id}"><input id="sRename" maxlength="20" value="${escapeHtml(s.name)}"><button class="mini" data-sact="save">确定</button><button class="mini" data-sact="cancel">取消</button></span>`;
    }
    const tools=(!isDef&&!renamingSeriesId)?`<span class="tag-tools"><i data-sact="edit" title="编辑">✎</i><i class="t-del" data-sact="del" title="删除"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></i></span>`:'';
    return `<span class="stag${seriesFilter===s.id?' active':''}${isDef?' def':''}" data-sid="${s.id}">${escapeHtml(s.name)}(${c})${tools}</span>`;
  }).join('');
  html+=addingSeries
    ?`<span class="stag renaming"><input id="sAdd" maxlength="20" placeholder="系列名称"><button class="mini" data-sact="addSave">确定</button><button class="mini" data-sact="cancelAdd">取消</button></span>`
    :`<span class="stag add" data-sact="add">+ 新增系列</span>`;
  $('seriesTags').innerHTML=html;
}
function handleSeriesAction(btn){
  const act=btn.dataset.sact;
  if(act==='add'){
    addingSeries=true;renamingSeriesId=null;renderSeries();
    const i=$('sAdd');if(i)i.focus();
  }else if(act==='addSave'){
    const v=($('sAdd').value||'').trim();
    if(!v)return alert('请输入系列名称');
    if(series.some(s=>s.name===v))return alert('已存在同名系列');
    const now=Date.now();
    series.push({id:'s'+now+Math.random().toString(36).slice(2,6),name:v,createdAt:now,updatedAt:now});
    persistSeries();addingSeries=false;renderSeries();syncSeriesSelect();
  }else if(act==='cancelAdd'){
    addingSeries=false;renderSeries();
  }else if(act==='edit'){
    const tag=btn.closest('.stag');
    if(tag&&tag.dataset.sid===DEFAULT_SERIES)return;
    renamingSeriesId=tag?tag.dataset.sid:null;
    renderSeries();
    const i=$('sRename');if(i)i.focus();
  }else if(act==='save'){
    const sid=renamingSeriesId,s=series.find(x=>x.id===sid);
    const v=($('sRename').value||'').trim();
    if(s&&v){
      if(series.some(x=>x.id!==sid&&x.name===v))return alert('已存在同名系列');
      s.name=v;s.updatedAt=Date.now();persistSeries();render();
    }
    renamingSeriesId=null;renderSeries();
  }else if(act==='cancel'){
    renamingSeriesId=null;renderSeries();
  }else if(act==='del'){
    const tag=btn.closest('.stag'),sid=tag?tag.dataset.sid:null;
    const s=series.find(x=>x.id===sid);
    if(!s||sid===DEFAULT_SERIES)return;
    const n=rules.filter(x=>x.seriesId===sid).length;
    const msg=n?`确定删除系列「${s.name}」？其下 ${n} 条规则将归入「默认系列」。`:`确定删除系列「${s.name}」？`;
    askConfirm(msg,()=>{
      rules.forEach(x=>{if(x.seriesId===sid)x.seriesId=DEFAULT_SERIES});
      persist();
      series=series.filter(x=>x.id!==sid);
      persistSeries();
      if(seriesFilter===sid)seriesFilter='';
      renderSeries();render();syncSeriesSelect();
    });
  }
}
let lpTimer=null;
const tagsEl=$('seriesTags');
function clearLp(){clearTimeout(lpTimer)}
tagsEl.addEventListener('pointerdown',e=>{
  const tag=e.target.closest('.stag[data-sid]');
  if(!tag||tag.classList.contains('renaming'))return;
  if(tag.dataset.sid===DEFAULT_SERIES)return;
  clearLp();
  const sid=tag.dataset.sid;
  lpTimer=setTimeout(()=>{
    tagsEl.querySelectorAll('.stag.show-tools').forEach(x=>x.classList.remove('show-tools'));
    const t=tagsEl.querySelector(`.stag[data-sid="${sid}"]`);
    if(t)t.classList.add('show-tools');
  },500);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>tagsEl.addEventListener(ev,clearLp));
tagsEl.addEventListener('pointermove',e=>{if(!e.target.closest('.stag[data-sid]'))clearLp()});
tagsEl.addEventListener('click',e=>{
  const act=e.target.closest('[data-sact]');
  if(act){handleSeriesAction(act);return}
  const tag=e.target.closest('.stag[data-sid]');
  if(!tag)return;
  if(renamingSeriesId||addingSeries)return;
  seriesFilter=seriesFilter===tag.dataset.sid?'':tag.dataset.sid;
  pageRule=1;
  renderSeries();render();
});

/* ============ 列表渲染 ============ */
function render(){
  renderSeries();
  const kw=$('kw').value.trim().toLowerCase();
  const list=rules.filter(x=>{
    if(kw&&!(String(x.shortName).toLowerCase().includes(kw)||String(x.name).toLowerCase().includes(kw)||String(x.code).toLowerCase().includes(kw)))return false;
    if(catFilter&&x.category!==catFilter)return false;
    if(seriesFilter&&x.seriesId!==seriesFilter)return false;
    if(srcFilter==='ext'&&!x.external)return false;
    if(srcFilter==='std'&&x.external)return false;
    return true;
  }).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

    renderPager($('pager'),0,1,null);
    return;

  const pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(pageRule>pages)pageRule=pages;
  renderPager($('pager'),list.length,pageRule,p=>{pageRule=p;render()});
  const rows=list.slice((pageRule-1)*PAGE_SIZE,pageRule*PAGE_SIZE);
  $('tbody').innerHTML=rows.map(x=>`<tr data-id="${x.id}">
    <td>
      <div class="nm-line"><span class="nm${x.offShelf?' off':''}" title="${escapeHtml(x.name)}">${escapeHtml(x.shortName)}</span></div>
      <div class="code-line"><code title="${escapeHtml(x.code)}">${escapeHtml(x.code)}</code><button class="copy-btn" data-act="copy" data-code="${escapeHtml(x.code)}" title="复制业务编码" aria-label="复制业务编码"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
    </td>
    <td class="full-name">${escapeHtml(x.name)}</td>
    <td><div class="cat-line"><span class="chip ${x.category}">${CAT_NAME[x.category]}</span><span class="stag stag-mini${(x.seriesId||DEFAULT_SERIES)===DEFAULT_SERIES?' def':''}" title="${escapeHtml(seriesName(x.seriesId))}">${escapeHtml(seriesName(x.seriesId))}</span>${x.external?'<span class="ext-badge" title="用户添加业务时自动创建">用户添加</span>':''}</div></td>
    <td class="price-cell">${x.price!=null?((x.category==='welfare'?'<small>最低</small>':'')+'¥'+Number(x.price).toFixed(2)):'—'}</td>
    <td><span class="shelf-badge ${x.offShelf?'off':'on'}" data-act="shelf" title="点击切换上架 / 下架">${x.offShelf?'已下架':'上架中'}</span></td>
    <td class="liab-txt">${x.liability?escapeHtml(x.liability):'—'}</td>
    <td class="ops">
      <button class="mini" data-act="edit">编辑</button>
      <button class="mini danger" data-act="del">删除</button>
    </td>
  </tr>`).join('');
}

function copyText(t,btn){
  const done=()=>{btn.classList.add('ok');toast('已复制业务编码');setTimeout(()=>btn.classList.remove('ok'),1200)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback());
  }else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){toast('复制失败，请手动复制')}
    ta.remove();
  }
}

$('tbody').addEventListener('click',e=>{
  const cp=e.target.closest('[data-act="copy"]');
  if(cp){copyText(cp.dataset.code,cp);return}
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  const tr=btn.closest('tr[data-id]'),id=tr?tr.dataset.id:null;
  const item=rules.find(x=>x.id===id);
  if(!item)return;
  if(btn.dataset.act==='shelf'){
    // 点击列表中的上架状态徽标直接切换上架 / 下架
    item.offShelf=!item.offShelf;
    item.updatedAt=Date.now();
    persist();render();
    toast(item.offShelf?'已下架「'+item.shortName+'」':'已上架「'+item.shortName+'」');
    return;
  }
  if(btn.dataset.act==='edit')openForm(item);
  else if(btn.dataset.act==='del'){
    const n=claimedCount(item.code);
    const msg=(n?`该业务编码已被认领 ${n} 次，删除后已认领的业务将保留显示但不再同步本规则。`:'')+'确定删除「'+item.shortName+'」（编码 '+item.code+'）？';
    askConfirm(msg,()=>{
      rules=rules.filter(x=>x.id!==id);
      persist();render();
      toast('已删除规则');
    });
  }
});

function openForm(item){
  editingId=item?item.id:null;
  $('formTitle').textContent=item?'编辑资费':'新增资费';
  $('formErr').textContent='';
  $('fShort').value=item?item.shortName:'';
  $('fName').value=item?item.name:'';
  $('fCode').value=item?item.code:'';
  const shelf=item?(item.offShelf?'off':'on'):'on';
  document.querySelectorAll('input[name="fShelf"]').forEach(r=>r.checked=r.value===shelf);
  syncSeriesSelect();
  if(item)$('fSeries').value=item.seriesId||DEFAULT_SERIES;
  const cat=item?item.category:'consume';
  document.querySelector(`input[name="fCat"][value="${cat}"]`).checked=true;
  const cond=item&&item.condAvg?item.condAvg:'avg3';
  document.querySelectorAll('input[name="fCond"]').forEach(r=>r.checked=r.value===cond);
  syncCondField();
  $('fRefPrice').value=item&&item.price!=null?Number(item.price).toFixed(2):'';
  syncPriceLabel();
  $('fLiability').value=item?item.liability:'';
  $('modal').classList.remove('hidden');
}
// 消费条件仅在条件福利类时显示
function syncCondField(){
  const cat=document.querySelector('input[name="fCat"]:checked').value;
  $('condField').classList.toggle('hidden',cat!=='welfare');
}
function syncPriceLabel(){
  const cat=document.querySelector('input[name="fCat"]:checked').value;
  $('priceLabel').innerHTML=`${cat==='welfare'?'最低消费':'消费金额'} <i>*</i>`;
  $('fRefPrice').placeholder=cat==='welfare'?'请输入最低消费，如10.00':'如：10.00';
}
document.querySelectorAll('input[name="fCat"]').forEach(r=>r.addEventListener('change',()=>{syncCondField();syncPriceLabel()}));
function closeForm(){$('modal').classList.add('hidden');editingId=null}
$('addBtn').addEventListener('click',()=>openForm(null));
$('closeBtn').addEventListener('click',closeForm);
$('cancelBtn').addEventListener('click',closeForm);
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});

function validate(){
  const shortName=cleanName($('fShort').value);
  const name=cleanName($('fName').value);
  const code=cleanName($('fCode').value);
  const seriesId=$('fSeries').value||DEFAULT_SERIES;
  const cat=document.querySelector('input[name="fCat"]:checked').value;
  if(!shortName)return '请填写资费简称';
  if(!name)return '请填写资费名称';
  if(!code)return '请填写业务编码';
  if(rules.some(x=>x.code===code&&x.id!==editingId))return '业务编码「'+code+'」已存在，编码是认领关联的唯一键';
  const priceRaw=$('fRefPrice').value.trim();
  if(priceRaw==='')return cat==='welfare'?'请填写最低消费':'请填写消费金额';
  if(!/^\d+(\.\d{1,2})?$/.test(priceRaw))return '消费金额需为数字，最多两位小数';
  const price=Number(priceRaw);
  if(!Number.isFinite(price)||price<0)return '消费金额不能为负数';
  if(price>99999)return '消费金额过大';
  const data={shortName,name,code,seriesId,category:cat,price,liability:$('fLiability').value.trim(),offShelf:document.querySelector('input[name="fShelf"]:checked').value==='off'};
  if(cat==='welfare'){
    const c=document.querySelector('input[name="fCond"]:checked');
    data.condAvg=c&&c.value==='avg6'?'avg6':'avg3';
  }
  return data;
}
$('saveBtn').addEventListener('click',()=>{
  const err=validate();
  if(typeof err==='string'){$('formErr').textContent=err;return}
  const now=Date.now();
  if(editingId){
    const i=rules.findIndex(x=>x.id===editingId);
    if(i>=0){
      const next={...rules[i],...err,updatedAt:now};
      if(next.category!=='welfare')delete next.condAvg; // 类别切为凑单消费类时清除消费条件
      rules[i]=next;
    }
  }else{
    rules.push({id:'r'+now+Math.random().toString(36).slice(2,6),...err,createdAt:now,updatedAt:now});
  }
  persist();closeForm();render();
  toast(editingId?'已保存资费':'已新增资费');
});

/* ============ xlsx 导入导出（规则字段） ============ */
const XLSX_COLS=[
  {key:'shortName',head:'资费简称',width:20,type:'s'},
  {key:'name',head:'资费名称',width:30,type:'s'},
  {key:'code',head:'业务编码',width:20,type:'s'},
  {key:'series',head:'资费系列',width:16,type:'s'},
  {key:'category',head:'资费类别',width:14,type:'s'},
  {key:'condAvg',head:'消费条件',width:16,type:'s'},
  {key:'price',head:'消费金额/最低消费',width:16,type:'n'},
  {key:'shelf',head:'上架状态',width:10,type:'s'},
  {key:'liability',head:'违约责任',width:34,type:'s'}

const XLSX_SHEET='资费规则';
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();

function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  const now=new Date();
  const time=((now.getHours()&31)<<11)|((now.getMinutes()&63)<<5)|((now.getSeconds()/2)&31);
  const date=(((now.getFullYear()-1980)&127)<<9)|(((now.getMonth()+1)&15)<<5)|(now.getDate()&31);

    const name=enc.encode(f.name),data=f.data,crc=crc32(data);

    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,0,true);
    lv.setUint16(10,time,true);lv.setUint16(12,date,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true);lv.setUint16(28,0,true);

    parts.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,time,true);cv.setUint16(14,date,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  });

  const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);
  const out=new Uint8Array(offset+cdSize+22);let p=0;
  parts.forEach(x=>{out.set(x,p);p+=x.length});
  central.forEach(x=>{out.set(x,p);p+=x.length});
  out.set(eocd,p);
  return out;
}
const XLSX_ENTITIES={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'};
function xmlText(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>XLSX_ENTITIES[c]).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}
function unescapeXml(s){return String(s==null?'':s).replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(Number(n))).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&')}
function colLetter(i){let s='',n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function xlsxRows(){
  const order=new Map(series.map((s,i)=>[s.id,i]));
  const list=rules.slice().sort((a,b)=>{
    const oa=order.has(a.seriesId)?order.get(a.seriesId):999,ob=order.has(b.seriesId)?order.get(b.seriesId):999;
    if(oa!==ob)return oa-ob;
    return String(a.code).localeCompare(String(b.code));
  });
  return [XLSX_COLS.map(c=>c.head)].concat(list.map(x=>XLSX_COLS.map(c=>{
    if(c.key==='shortName')return x.shortName||'';
    if(c.key==='name')return x.name||'';
    if(c.key==='code')return x.code||'';
    if(c.key==='series')return seriesName(x.seriesId);
    if(c.key==='category')return CAT_NAME[x.category]||'';
    if(c.key==='condAvg')return x.category==='welfare'?(x.condAvg==='avg6'?'近6月平均消费':'近3月平均消费'):'';
    if(c.key==='price')return x.price!=null?Number(x.price):'';
    if(c.key==='shelf')return x.offShelf?'已下架':'上架中';
    if(c.key==='liability')return x.liability||'';
    return '';
  })));
}
function buildSheetXml(rows){
  const body=rows.map((cells,ri)=>cells.map((v,ci)=>{
    const ref=colLetter(ci)+(ri+1);
    if(v===''||v==null)return '';
    if(ri===0)return `<c r="${ref}" s="1" t="inlineStr"><is><t xml:space="preserve">${xmlText(v)}</t></is></c>`;
    if(typeof v==='number'&&Number.isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlText(v)}</t></is></c>`;
  }).join('')).map((cells,ri)=>`<row r="${ri+1}"${ri===0?' ht="22" customHeight="1"':''}>${cells}</row>`).join('');
  const last=colLetter(XLSX_COLS.length-1)+rows.length;
  const cols=XLSX_COLS.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.width}" customWidth="1"/>`).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${last}"/><sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${cols}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`;
}
const XLSX_CT='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
const XLSX_RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
const XLSX_WB='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+XLSX_SHEET+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
const XLSX_WB_RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
const XLSX_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><color theme="1"/><name val="等线"/><family val="2"/><charset val="134"/></font><font><b/><sz val="11"/><color theme="1"/><name val="等线"/><family val="2"/><charset val="134"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFF4FA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
function buildXlsx(){
  const enc=new TextEncoder();

    f('[Content_Types].xml',XLSX_CT),
    f('_rels/.rels',XLSX_RELS),

function exportXlsx(){

async function inflateRaw(bytes){

async function unzip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);

  const files={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true);

}

function parseSheetXml(xml,sst){
  const rows=[];
  const rowRe=/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
  let rm;
  while((rm=rowRe.exec(xml))){
    const inner=rm[1]||'';
    const cells=[];
    const cellRe=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let cm;
    while((cm=cellRe.exec(inner))){
      const attrs=cm[1]||'',body=cm[2]||'';
      const refM=attrs.match(/\br="([A-Z]+)\d+"/);
      const col=refM?refM[1].split('').reduce((n,ch)=>n*26+(ch.charCodeAt(0)-64),0)-1:cells.length;
      const tM=attrs.match(/\bt="([^"]+)"/);
      const type=tM?tM[1]:'n';
      let val='';
      if(type==='inlineStr'){
        const isM=body.match(/<is>([\s\S]*?)<\/is>/);
        if(isM){let tx='';isM[1].replace(/<t[^>]*>([\s\S]*?)<\/t>/g,(m,t)=>{tx+=t;return m});val=unescapeXml(tx)}
      }else{
        const vM=body.match(/<v[^>]*>([\s\S]*?)<\/v>/);
        if(vM)val=unescapeXml(vM[1]);
        if(type==='s')val=sst[Number(val)]!=null?sst[Number(val)]:'';
      }
      cells[col]=val;
    }
    rows.push(cells);
  }
  return rows;
}
async function readXlsx(buf){
  const files=await unzip(new Uint8Array(buf));
  const dec=async name=>{
    const f=files[name];
    if(!f)return null;
    const bytes=f.method===0?f.data:await inflateRaw(f.data);
    return new TextDecoder('utf-8').decode(bytes);
  };
  let sheetPath='xl/worksheets/sheet1.xml';
  const wb=await dec('xl/workbook.xml');
  const rels=await dec('xl/_rels/workbook.xml.rels');
  if(wb&&rels){
    const sheets=[...wb.matchAll(/<sheet\b[^>]*>/g)].map(m=>m[0]);
    for(const tag of sheets){
      const idM=tag.match(/r:id="([^"]+)"/);
      if(!idM)continue;
      const relTag=(rels.match(/<Relationship\b[^>]*>/g)||[]).find(t=>new RegExp('Id="'+idM[1]+'"').test(t));
      if(!relTag)continue;
      const tg=relTag.match(/Target="([^"]+)"/);
      if(!tg)continue;
      let t=tg[1];
      if(t.startsWith('/'))sheetPath=t.slice(1);
      else if(t.startsWith('xl/'))sheetPath=t;
      else sheetPath='xl/'+t.replace(/^\.\//,'');
      break;
    }
  }
  const sst=parseSharedStrings((await dec('xl/sharedStrings.xml'))||'');
  const sheetXml=await dec(sheetPath)||await dec('xl/worksheets/sheet1.xml');
  if(!sheetXml)throw new Error('文件里没有找到工作表数据');
  return parseSheetXml(sheetXml,sst);
}
const IMPORT_ALIASES={
  shortName:['资费简称','简称'],
  name:['资费名称','名称','业务名称','官方名称'],
  code:['业务编码','编码'],
  series:['资费系列','系列','所属系列'],
  category:['资费类别','类别','业务类别'],
  condAvg:['消费条件'],
  price:['消费金额/最低消费','消费金额','最低消费'],
  shelf:['上架状态','状态'],
  liability:['违约责任','违约']
};
function normHead(s){
  return String(s==null?'':s).replace(/[\s\u3000]/g,'').replace(/[（(][^）)]*[）)]/g,'').replace(/[：:*]/g,'').replace(/元$/,'');
}
function parseImportRows(rows){
  let headerRow=-1,map={};
  for(let i=0;i<Math.min(rows.length,10);i++){
    const built={};
    (rows[i]||[]).forEach((cell,ci)=>{
      const key=normHead(cell);
      if(!key)return;
      Object.keys(IMPORT_ALIASES).forEach(k=>{
        if(built[k]===undefined&&IMPORT_ALIASES[k].some(a=>a===key))built[k]=ci;
      });
    });
    if(built.shortName!==undefined||built.name!==undefined||built.code!==undefined){headerRow=i;map=built;break}
  }
  if(headerRow<0)throw new Error('未找到表头行，表格需包含「资费简称 / 资费名称 / 业务编码」列');
  const records=[],errors=[];
  for(let i=headerRow+1;i<rows.length;i++){
    const row=rows[i]||[];
    const get=k=>map[k]===undefined?'':String(row[map[k]]==null?'':row[map[k]]).trim();
    const shortName=cleanName(get('shortName')),name=cleanName(get('name')),code=cleanName(get('code'));
    if(!shortName&&!name&&!code){
      if(row.some(v=>String(v==null?'':v).trim()!==''))errors.push('第 '+(i+1)+' 行：缺少资费简称 / 名称 / 编码，已跳过');
      continue;
    }
    if(!code){errors.push('第 '+(i+1)+' 行「'+(shortName||name)+'」：缺少业务编码，已跳过');continue}
    if(!shortName&&!name){errors.push('第 '+(i+1)+' 行：缺少资费简称和资费名称，已跳过');continue}
    const catRaw=get('category');
    let category='';
    if(/福利/.test(catRaw))category='welfare';
    else if(/凑单|消费/.test(catRaw))category='consume';
    else if(!catRaw)category='';
    if(!category){errors.push('第 '+(i+1)+' 行「'+(shortName||name)+'」：资费类别无法识别'+(catRaw?'（'+catRaw+'）':'，缺少类别')+'，已跳过');continue}
    let condAvg;
    if(category==='welfare'){
      const condRaw=get('condAvg');
      if(/6/.test(condRaw))condAvg='avg6';
      else condAvg='avg3'; // 缺省按近3月
    }
    let price=null;
    const priceRaw=get('price');
    if(priceRaw!==''&&/^\d+(\.\d{1,2})?$/.test(priceRaw))price=Number(priceRaw);
    const shelfRaw=get('shelf');
    const offShelf=/下架/.test(shelfRaw)?true:(/上架/.test(shelfRaw)?false:null);
    records.push({shortName:shortName||name,name:name||shortName,code,seriesName:cleanName(get('series')),category,condAvg,price,liability:get('liability'),offShelf});
  }
  return {records,errors};
}
// 导入计划：按 code 去重判定新增/更新；系列新建/复用
function planImport(records){
  const idByName=new Map();
  series.forEach(s=>{if(!idByName.has(s.name))idByName.set(s.name,s.id)});
  const newNames=[],reused=[];
  const seen=new Set();
  let add=0,update=0;
  records.forEach(r=>{
    const sname=r.seriesName;
    let sid;
    if(!sname){
      sid=DEFAULT_SERIES;
      if(!seen.has('默认系列')){seen.add('默认系列');reused.push('默认系列')}
    }else if(idByName.has(sname)){
      sid=idByName.get(sname);
      if(!seen.has(sname)){seen.add(sname);reused.push(sname)}
    }else{
      sid='NEW:'+sname;
      if(!seen.has(sname)){seen.add(sname);newNames.push(sname)}
    }
    r._sid=sid;
    if(rules.some(x=>x.code===r.code))update++;else add++;
  });
  return {add,update,newNames,reused,seriesTotal:newNames.length+reused.length};
}
function applyImport(records,plan){
  const now=Date.now();
  let created=0;
  (plan&&plan.newNames?plan.newNames:[]).forEach(name=>{
    const sid='s'+now+Math.random().toString(36).slice(2,6);
    series.push({id:sid,name,createdAt:now,updatedAt:now});
    created++;
  });
  records.forEach((r,i)=>{
    let sid=r._sid;
    if(String(sid).startsWith('NEW:')){
      const s=series.find(x=>x.name===String(sid).slice(4));
      sid=s?s.id:DEFAULT_SERIES;
    }
    const data={shortName:r.shortName,name:r.name,code:r.code,category:r.category,seriesId:sid,liability:r.liability,updatedAt:now};
    if(r.offShelf!=null)data.offShelf=r.offShelf;
    if(r.category==='welfare'&&r.condAvg)data.condAvg=r.condAvg;
    if(r.price!=null)data.price=r.price;
    const exist=rules.find(x=>x.code===r.code);
    if(exist)Object.assign(exist,data);
    else rules.push({id:'r'+now+i+Math.random().toString(36).slice(2,6),...data,createdAt:now});
  });
  persistSeries();
  persist();renderSeries();render();syncSeriesSelect();
  return {seriesAdded:created};
}
$('exportBtn').addEventListener('click',exportXlsx);
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!file)return;
  await handleImportFile(file);
});
async function handleImportFile(file){
  if(!/\.xlsx$/i.test(file.name)){showInfo('格式不支持','仅支持 .xlsx 格式的 Excel 文件（.xls / .csv 请先另存为 .xlsx）。');return}
  let rows;
  try{rows=await readXlsx(await file.arrayBuffer())}
  catch(err){showInfo('导入失败',(err&&err.message)||'无法解析该文件，请确认它是有效的 .xlsx 文件。');return}
  let parsed;
  try{parsed=parseImportRows(rows)}
  catch(err){showInfo('导入失败',(err&&err.message)||'表格格式不符合要求。');return}
  const plan=planImport(parsed.records);
  const lines=[
    '文件：'+file.name,
    '识别到 '+parsed.records.length+' 条规则：新增 '+plan.add+' 条，更新 '+plan.update+' 条（按业务编码匹配）。',
    '系列：共 '+plan.seriesTotal+' 个'+(plan.newNames.length?'，新建 '+plan.newNames.length+' 个（'+plan.newNames.join('、')+'）':'，全部复用。'),
    parsed.errors.length?'另有 '+parsed.errors.length+' 行不符合要求，将被跳过。':''
  ].filter(Boolean).join('\n');
  askConfirm(lines,()=>{
    const res=applyImport(parsed.records,plan);
    const out=['新增 '+plan.add+' 条，更新 '+plan.update+' 条'+(res.seriesAdded?'，新增资费系列 '+res.seriesAdded+' 个':'')+'。'];
    if(parsed.errors.length)out.push('跳过 '+parsed.errors.length+' 行：\n'+parsed.errors.slice(0,5).join('\n')+(parsed.errors.length>5?'\n…':''));
    showInfo('导入完成',out.join('\n'));
  },{title:'导入确认',okText:'导入',okClass:''});
}

/* ============ 启动 ============ */
if(checkAccess()){
  loadRules();
  render();
  syncSeriesSelect();
  bindPager($('pager'));
}
