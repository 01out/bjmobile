<script data-page-node-id="7Xful8Q45WC1a20HbkMWYs" data-pnid-children="ZMVGOSDXPlupBcBnD0CFmj">
const KEY_V2='arpu_business_v2';        // 业务数据分桶：{ [手机号]: [业务...] }
const KEY_LEGACY='arpu_business_v1';    // 旧版全局单套键（一次性迁移后移除）
const KEY_BAK='arpu_business_v1_backup';// 旧数据备份键
const KEY_Q='arpu_last_query';          // 当前身份：index 查询时写入的手机号
const KEY_S='arpu_series_v1';
const KEY_R='arpu_rules_v1';
const OWNER_PHONE='17600799221';        // 维护者号码（旧数据迁移归属号）

let curPhone='';
function maskPhone(p){return /^\d{11}$/.test(p)?p.slice(0,3)+'****'+p.slice(-4):p||''}
function readIdentity(){
  let q='';try{q=(localStorage.getItem(KEY_Q)||'').trim()}catch(e){}
  curPhone=/^1[3-9]\d{9}$/.test(q)?q:'';
  const tag=document.getElementById('curPhoneTag');
  if(tag)tag.textContent=curPhone?maskPhone(curPhone):'—';
  document.body.classList.toggle('no-identity',!curPhone);
  const dv=document.getElementById('denyView');
  if(dv)dv.style.display=curPhone?'none':'flex';
}
function loadAllBuckets(){
  try{const m=JSON.parse(localStorage.getItem(KEY_V2)||'{}');return (m&&typeof m==='object'&&!Array.isArray(m))?m:{}}catch(e){return {}}
}
// 一次性迁移：旧维护者号（776…）桶改名到新 owner 号（176…）名下；旧版全局业务数据归入维护者号码名下
function migrateLegacy(){
  let all=loadAllBuckets();
  if(Array.isArray(all['77600799221'])&&!(Array.isArray(all[OWNER_PHONE])&&all[OWNER_PHONE].length)){
    all[OWNER_PHONE]=all['77600799221'];  // 176 桶为空才接管；776 桶保留不删，防数据丢失（与 index 页同口径）
    try{localStorage.setItem(KEY_V2,JSON.stringify(all))}catch(e){}
  }
  let old=null;try{old=JSON.parse(localStorage.getItem(KEY_LEGACY)||'null')}catch(e){}
  if(!Array.isArray(old))return;
  try{localStorage.setItem(KEY_BAK,JSON.stringify(old))}catch(e){}

/* ============ 分页插件（最简：共 N 条数据 + 页码） ============ */
function renderPager(el,total,page,onPage,size){
  const per=size||PAGE_SIZE;
  if(!el)return;
  if(!total){el.innerHTML='';el.classList.add('hidden');return}
  el.classList.remove('hidden');
  const pages=Math.max(1,Math.ceil(total/per));
  if(page>pages)page=pages;
  let nums=[];
  if(pages<=7){for(let i=1;i<=pages;i++)nums.push(i)}
  else{
    nums.push(1);
    const lo=Math.max(2,page-1),hi=Math.min(pages-1,page+1);
    if(lo>2)nums.push('…');
    for(let i=lo;i<=hi;i++)nums.push(i);
    if(hi<pages-1)nums.push('…');
    nums.push(pages);
  }
  el.innerHTML=`<span class="pg-info">共 ${total} 条数据</span><span class="pg-btns">`
    +`<button type="button" class="pg-btn" data-pg="${page-1}"${page<=1?' disabled':''}>‹</button>`
    +nums.map(n=>n==='…'?'<span class="pg-dots">…</span>':`<button type="button" class="pg-btn num${n===page?' active':''}" data-pg="${n}">${n}</button>`).join('')
    +`<button type="button" class="pg-btn" data-pg="${page+1}"${page>=pages?' disabled':''}>›</button></span>`;
  el._onPage=onPage;
}
function bindPager(el){
  if(!el||el._pagerBound)return;
  el._pagerBound=true;
  el.addEventListener('click',e=>{
    const b=e.target.closest('.pg-btn');
    if(!b||b.disabled||!el._onPage)return;
    el._onPage(Number(b.dataset.pg));
  });
}

/* ============ 起止日期：范围内自动开通、范围外自动关闭 ============ */
function todayStr(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function monthOf(s){return s?String(s).slice(0,7):''}
// 返回 null 表示未设置起止日期（不干预开通状态）；true/false 为按日期判定的开通状态
// 口径：未到开始日期则关闭；结束日期所在整月仍开通，结束月次月 1 日起自动关闭
function dateAutoActive(x,today){
  const s=x&&x.startDate?String(x.startDate):'';
  const e=x&&x.endDate?String(x.endDate):'';
  if(!s&&!e)return null;
  const t=today||todayStr();
  if(s&&t<s)return false;
  if(e&&monthOf(t)>monthOf(e))return false;
  return true;
}
function applyDateStates(){
  const t=todayStr();let changed=false;
  items.forEach(x=>{
    const auto=dateAutoActive(x,t);
    if(auto==null)return;
    if(auto===false){
      // 兜底：到期自动关闭，并清除手动关闭标记（日期已不覆盖该业务，标记失去意义）
      if(x.active){x.active=false;changed=true}
      if(x.manualOff){delete x.manualOff;changed=true}
    }else if(!x.manualOff&&!x.active){
      // 范围内自动开通；用户手动关闭过的业务不干预（手动关闭优先级最高）
      x.active=true;changed=true;
    }
  });
  return changed;
}
function dateRangeText(x){
  const s=x&&x.startDate?String(x.startDate):'';
  const e=x&&x.endDate?String(x.endDate):'';
  if(s&&e)return `${s} 至 ${e}`;
  if(s)return `${s} 起`;
  if(e)return `至 ${e}`;
  return '未设置起止日期';
}
/* ============ 同系列互斥：自定义系列内仅允许一个业务开通 ============ */
function seriesOf(x){return (x&&x.seriesId)?x.seriesId:DEFAULT_SERIES}
// 关闭同系列多余的开通项；preferredId 为本次操作要保留的业务（开关/保存）
// prevActive：页面加载时原有的开通集合，用于冲突时保留用户原本的选择
// 返回被自动关闭的业务数组
function enforceSeriesExclusive(preferredId,prevActive){
  const today=todayStr();
  const groups={};
  items.forEach(x=>{
    if(!x||!x.active)return;
    const sid=seriesOf(x);
    if(sid===DEFAULT_SERIES)return;
    (groups[sid]=groups[sid]||[]).push(x);
  });
  const off=[];
  Object.keys(groups).forEach(sid=>{
    const list=groups[sid];
    if(list.length<2)return;
    let keep=preferredId?list.find(x=>x.id===preferredId):null;
    if(!keep&&prevActive&&prevActive.size){
      const kept=list.filter(x=>prevActive.has(x.id));
      if(kept.length===1)keep=kept[0];
    }
    if(!keep){
      // 优先保留按起止日期自动开通的，其次开始日期更晚的，再次最近更新的
      const rank=x=>({
        auto:dateAutoActive(x,today)===true?1:0,
        start:x.startDate?String(x.startDate):'',
        upd:x.updatedAt||0
      });
      keep=list.slice().sort((a,b)=>{
        const ra=rank(a),rb=rank(b);
        if(ra.auto!==rb.auto)return rb.auto-ra.auto;
        if(ra.start!==rb.start)return ra.start<rb.start?1:-1;
        return rb.upd-ra.upd;
      })[0];
    }
    // 被互斥关闭的业务记 manualOff，避免下次日期刷新又被自动开通，形成反复横跳
    list.forEach(x=>{if(x.id!==keep.id&&x.active){x.active=false;x.manualOff=true;off.push(x)}});
  });
  return off;
}
function offNames(list){return list.map(x=>`「${x.name}」`).join('、')}
// 价格输入：只允许数字与一个小数点（最多两位小数）
function sanitizePrice(v){
  let s=String(v==null?'':v).replace(/[^\d.]/g,'');
  const i=s.indexOf('.');
  if(i!==-1)s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,'');
  const m=s.match(/^\d*(\.\d{0,2})?/);
  return m?m[0]:'';
}

function validate(){
  if(!editingId){
    if(!pickedSet.size)return '请先勾选要添加的业务';
    return '';
  }
  const priceRaw=$('fPrice').value.trim();
  if(priceRaw==='')return '请填写资费价格';
  if(!/^\d+(\.\d{1,2})?$/.test(priceRaw))return '价格需为数字，最多两位小数';
  const price=Number(priceRaw);
  if(!Number.isFinite(price)||price<0)return '价格不能为负数';
  if(price>99999)return '价格过大';
  const woolRaw=$('fWool').value.trim();
  if(woolRaw==='')return '请填写羊毛';
  if(!/^\d+(\.\d{1,2})?$/.test(woolRaw))return '羊毛需为数字，最多两位小数';
  const wool=Number(woolRaw);
  if(!Number.isFinite(wool)||wool<0)return '羊毛不能为负数';
  if(wool>99999)return '羊毛过大';
  const startDate=$('fStart').value, endDate=$('fEnd').value;
  if(startDate&&endDate&&startDate>endDate)return '开始日期不能晚于结束日期';
  return '';
}

function save(){
  const err=validate();
  if(err){$('formErr').textContent=err;return}
  if(!editingId&&!pickedCode&&!pickedSet.size)return;
  const now=Date.now();
  let savedId=editingId;
  if(editingId){
    const r=pickedCode?ruleMap.get(pickedCode):null;
    const price=Number($('fPrice').value.trim());
    const active=document.querySelector('input[name="fStatus"]:checked').value==='on';
    const i=items.findIndex(x=>x.id===editingId);
    if(i>=0){
      const prev=items[i];
      const next={...prev,price,wool:Number($('fWool').value.trim()),startDate:$('fStart').value||'',endDate:$('fEnd').value||'',active,updatedAt:now};
      // 开通状态以本次保存为准：开通则解除手动关闭标记；由开通改为未开通视为手动关闭
      if(active)delete next.manualOff;
      else if(prev.active)next.manualOff=true;
      items[i]=next;
    }
  }else{
    // 批量添加：定义字段来自资费规则（规则页修改后自动同步），消费值取规则消费金额，羊毛默认 0
    let n=0;
    [...pickedSet].forEach(code=>{
      const r=ruleMap.get(code);
      if(!r||items.some(x=>x.code===code))return;
      const data={
        code,
        name:cleanName(r.name)||cleanName(r.shortName),
        category:r.category,type:r.category,
        seriesId:series.some(x=>x.id===r.seriesId)?r.seriesId:DEFAULT_SERIES,
        liability:r.liability||'',
        condAvg:r.category==='welfare'?(r.condAvg==='avg6'?'avg6':'avg3'):undefined,
        price:r.price!=null?Number(r.price):0,
        wool:0,
        startDate:'',endDate:'',
        active:false
      };
      if(!data.condAvg)delete data.condAvg;
      items.push({id:'b'+now+(n++)+Math.random().toString(36).slice(2,6),...data,createdAt:now,updatedAt:now});
    });
    savedId=null;
  }
  applyDateStates();
  // 同一自定义系列互斥：本次保存为开通时，自动关闭同系列其他业务
  const off=enforceSeriesExclusive(savedId);
  persist();closeForm();render();
  if(off.length)toast(`同系列业务互斥，已关闭${offNames(off)}`);
}

  const done=()=>{if(btn){btn.classList.add('ok');setTimeout(()=>btn.classList.remove('ok'),1200)}toast(msg||'已复制业务编码')};
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){toast('复制失败，请手动复制')}
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(fallback);
  }else fallback();
}

/* ---- 字节工具 ---- */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
// 仅存储（不压缩）的 zip：xlsx 允许，Excel / WPS / Numbers 均可打开
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  const now=new Date();
  const time=((now.getHours()&31)<<11)|((now.getMinutes()&63)<<5)|((now.getSeconds()/2)&31);
  const date=(((now.getFullYear()-1980)&127)<<9)|(((now.getMonth()+1)&15)<<5)|(now.getDate()&31);
  files.forEach(f=>{
    const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new Uint8Array(30+name.length),lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,0,true);
    lv.setUint16(10,time,true);lv.setUint16(12,date,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true);lv.setUint16(28,0,true);
    lh.set(name,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,time,true);cv.setUint16(14,date,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  });
  const cdSize=central.reduce((n,c)=>n+c.length,0);
  const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);
  const out=new Uint8Array(offset+cdSize+22);let p=0;
  parts.forEach(x=>{out.set(x,p);p+=x.length});
  central.forEach(x=>{out.set(x,p);p+=x.length});
  out.set(eocd,p);
  return out;
}
const XLSX_ENTITIES={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'};
function xmlText(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>XLSX_ENTITIES[c]).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}
function unescapeXml(s){return String(s==null?'':s).replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(Number(n))).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&')}
function colLetter(i){let s='',n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
// 日期与 Excel 序列号互转（以 1899-12-30 为 0，按 UTC 计算避免时区偏移）
function dateToSerial(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||'')))return null;
  const p=String(s).split('-').map(Number);
  return Date.UTC(p[0],p[1]-1,p[2])/86400000+25569;
}
function serialToDate(n){
  const v=Number(n);
  if(!Number.isFinite(v)||v<1)return '';
  const d=new Date(Math.round((v-25569)*86400000));
  if(isNaN(d.getTime()))return '';
  const p=x=>String(x).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
}

const XLSX_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy\\-mm\\-dd"/></numFmts><fonts count="2"><font><sz val="11"/><color theme="1"/><name val="等线"/><family val="2"/><charset val="134"/></font><font><b/><sz val="11"/><color theme="1"/><name val="等线"/><family val="2"/><charset val="134"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFF4FA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

// 导出顺序：按系列分组，同系列资费从低到高
function xlsxRows(){
  const order=new Map(series.map((s,i)=>[s.id,i]));
  const list=items.slice().sort((a,b)=>{
    const sa=seriesOf(a),sb=seriesOf(b);
    const oa=order.has(sa)?order.get(sa):999,ob=order.has(sb)?order.get(sb):999;
    if(oa!==ob)return oa-ob;
    return (Number(a.price)||0)-(Number(b.price)||0);
  });
  return [XLSX_COLS.map(c=>c.head)].concat(list.map(x=>XLSX_COLS.map(c=>{
    if(c.key==='code')return x.code||'';
    if(c.key==='name')return x.name||'';
    if(c.key==='category')return x.category==='welfare'?'条件福利类':'消费凑单类';
    if(c.key==='series')return seriesName(x.seriesId);
    if(c.key==='cond')return x.category==='welfare'?(x.condAvg==='avg6'?'近6个月平均消费':'近3个月平均消费'):'';
    if(c.key==='price')return Number(x.price)||0;
    if(c.key==='wool')return Number(x.wool)||0;
    if(c.key==='start')return x.startDate||'';
    if(c.key==='end')return x.endDate||'';
    if(c.key==='liability')return x.liability||'';
    if(c.key==='status')return x.active?'已开通':'未开通';
    return '';
  })));
}
function buildSheetXml(rows){
  const body=rows.map((cells,ri)=>cells.map((v,ci)=>{
    const ref=colLetter(ci)+(ri+1);
    if(v===''||v==null)return '';
    if(ri===0)return `<c r="${ref}" s="1" t="inlineStr"><is><t xml:space="preserve">${xmlText(v)}</t></is></c>`;
    const type=(XLSX_COLS[ci]||{}).type;
    if(type==='n')return `<c r="${ref}" s="2"><v>${Number(v)||0}</v></c>`;
    if(type==='d'){
      const serial=dateToSerial(v);
      if(serial!=null)return `<c r="${ref}" s="3"><v>${serial}</v></c>`;
    }
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlText(v)}</t></is></c>`;
  }).join('')).map((cells,ri)=>`<row r="${ri+1}"${ri===0?' ht="22" customHeight="1"':''}>${cells}</row>`).join('');
  const last=colLetter(XLSX_COLS.length-1)+rows.length;
  const cols=XLSX_COLS.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.width}" customWidth="1"/>`).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${last}"/><sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${cols}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`;
}
function buildXlsx(){
  const enc=new TextEncoder();
  const f=(name,str)=>({name,data:enc.encode(str)});
  return zipStore([
    f('[Content_Types].xml',XLSX_CT),
    f('_rels/.rels',XLSX_RELS),
    f('xl/workbook.xml',XLSX_WB),
    f('xl/_rels/workbook.xml.rels',XLSX_WB_RELS),
    f('xl/styles.xml',XLSX_STYLES),
    f('xl/worksheets/sheet1.xml',buildSheetXml(xlsxRows()))
  ]);
}
function exportXlsx(){
  if(!items.length){showInfo('暂无数据','当前没有业务数据，先新增或导入后再导出。');return}
  let bytes;
  try{bytes=buildXlsx()}catch(e){showInfo('导出失败',(e&&e.message)||'生成 Excel 文件时出错');return}
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fname=`资费业务_${curPhone||'未识别'}_${todayStr().replace(/-/g,'')}.xlsx`;
  if(typeof navigator!=='undefined'&&navigator.msSaveBlob){navigator.msSaveBlob(blob,fname);return}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fname;a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
  toast(`已导出 ${items.length} 条业务`);
}

/* ---- 读取 xlsx ---- */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持解析 xlsx，请使用新版 Chrome / Edge / Safari 后重试');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  }
  if(eocd<0)throw new Error('文件不是有效的 xlsx（压缩包结构缺失）');
  const count=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  const files={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true);
    const compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),cmtLen=dv.getUint16(p+32,true);
    const localOff=dv.getUint32(p+42,true);
    const name=new TextDecoder('utf-8').decode(u8.subarray(p+46,p+46+nameLen));
    const lNameLen=dv.getUint16(localOff+26,true),lExtraLen=dv.getUint16(localOff+28,true);
    const start=localOff+30+lNameLen+lExtraLen;
    files[name]={method,data:u8.subarray(start,start+compSize)};
    p+=46+nameLen+extraLen+cmtLen;
  }
  return files;
}
function parseSharedStrings(xml){
  const out=[];
  const items=xml.match(/<si\b[^>]*\/>|<si\b[^>]*>[\s\S]*?<\/si>/g)||[];
  items.forEach(si=>{
    let text='';
    si.replace(/<t[^>]*>([\s\S]*?)<\/t>/g,(m,t)=>{text+=t;return m});
    out.push(unescapeXml(text));
  });
  return out;
}
function parseSheetXml(xml,sst){
  const rows=[];
  const rowRe=/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
  let rm;
  while((rm=rowRe.exec(xml))){
    const inner=rm[1]||'';
    const cells=[];
    const cellRe=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let cm;
    while((cm=cellRe.exec(inner))){
      const attrs=cm[1]||'',body=cm[2]||'';
      const refM=attrs.match(/\br="([A-Z]+)\d+"/);
      const col=refM?refM[1].split('').reduce((n,ch)=>n*26+(ch.charCodeAt(0)-64),0)-1:cells.length;
      const tM=attrs.match(/\bt="([^"]+)"/);
      const type=tM?tM[1]:'n';
      let val='';
      if(type==='inlineStr'){
        const isM=body.match(/<is>([\s\S]*?)<\/is>/);
        if(isM){let tx='';isM[1].replace(/<t[^>]*>([\s\S]*?)<\/t>/g,(m,t)=>{tx+=t;return m});val=unescapeXml(tx)}
      }else{
        const vM=body.match(/<v[^>]*>([\s\S]*?)<\/v>/);
        if(vM)val=unescapeXml(vM[1]);
        if(type==='s')val=sst[Number(val)]!=null?sst[Number(val)]:'';
        else if(type==='b')val=val==='1'?'TRUE':'FALSE';
      }
      cells[col]=val;
    }
    rows.push(cells);
  }
  return rows;
}
async function readXlsx(buf){
  const files=await unzip(new Uint8Array(buf));
  const dec=async name=>{
    const f=files[name];
    if(!f)return null;
    const bytes=f.method===0?f.data:await inflateRaw(f.data);
    return new TextDecoder('utf-8').decode(bytes);
  };
  // 定位第一个工作表（优先按 workbook 关系表，找不到再退回 sheet1.xml）
  let sheetPath='xl/worksheets/sheet1.xml';
  const wb=await dec('xl/workbook.xml');
  const rels=await dec('xl/_rels/workbook.xml.rels');
  if(wb&&rels){
    const sheets=[...wb.matchAll(/<sheet\b[^>]*>/g)].map(m=>m[0]);
    for(const tag of sheets){
      const idM=tag.match(/r:id="([^"]+)"/);
      if(!idM)continue;
      const relTag=(rels.match(/<Relationship\b[^>]*>/g)||[]).find(t=>new RegExp(`Id="${idM[1]}"`).test(t));
      if(!relTag)continue;
      const tg=relTag.match(/Target="([^"]+)"/);
      if(!tg)continue;
      let t=tg[1];
      if(t.startsWith('/'))sheetPath=t.slice(1);
      else if(t.startsWith('xl/'))sheetPath=t;
      else sheetPath='xl/'+t.replace(/^\.\//,'');
      break;
    }
  }
  const sst=parseSharedStrings((await dec('xl/sharedStrings.xml'))||'');
  const sheetXml=await dec(sheetPath)||await dec('xl/worksheets/sheet1.xml');
  if(!sheetXml)throw new Error('文件里没有找到工作表数据');
  return parseSheetXml(sheetXml,sst);
}

/* ---- 表格行 → 业务数据 ---- */
const IMPORT_ALIASES={
  name:['业务名称','名称','业务'],
  code:['业务编码','编码'],
  category:['业务类别','类别'],
  series:['所属系列','系列','资费系列'],
  cond:['消费条件','平均消费'],
  price:['资费价格','最低消费','资费','价格'],
  wool:['羊毛','返利'],
  start:['开始日期','起始日期','开始时间','生效日期'],
  end:['结束日期','截止日期','结束时间','失效日期'],
  liability:['违约责任','违约'],
  status:['开通状态','状态']
};
function normHead(s){
  return String(s==null?'':s).replace(/[\s\u3000]/g,'').replace(/[（(][^）)]*[）)]/g,'').replace(/[：:*]/g,'').replace(/元$/,'');
}
function toNum(v){
  const s=String(v==null?'':v).replace(/[,，¥￥\s]/g,'');
  if(s==='')return null;
  const n=Number(s);
  return Number.isFinite(n)?Math.round(n*100)/100:null;
}
function toDate(v){
  const raw=String(v==null?'':v).trim();
  if(!raw)return '';
  if(/^\d+(\.\d+)?$/.test(raw)){
    const n=Number(raw);
    if(n>=1&&n<90000)return serialToDate(n);
  }
  let m=raw.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=raw.match(/^(\d{4})[-/.年](\d{1,2})月?$/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-01`;
  return '';
}
function parseStatus(v){
  const t=String(v==null?'':v).trim();
  if(!t)return false;
  if(/^(未|否|关|off|0|false|no)/i.test(t))return false;
  return /已开通|开通|是|on|1|true|yes/i.test(t);
}
function mapImportRows(rows){
  let headerRow=-1,map={};
  for(let i=0;i<Math.min(rows.length,10);i++){
    const built={};
    (rows[i]||[]).forEach((cell,ci)=>{
      const key=normHead(cell);
      if(!key)return;
      Object.keys(IMPORT_ALIASES).forEach(k=>{
        if(built[k]===undefined&&IMPORT_ALIASES[k].some(a=>a===key))built[k]=ci;
      });
    });
    if(built.name!==undefined){headerRow=i;map=built;break}
  }
  if(headerRow<0)throw new Error('未找到表头行，表格需包含「业务名称」列');
  const records=[],errors=[];
  for(let i=headerRow+1;i<rows.length;i++){
    const row=rows[i]||[];
    const get=k=>map[k]===undefined?'':String(row[map[k]]==null?'':row[map[k]]).trim();
    const name=cleanName(get('name'));
    const code=cleanName(get('code'));
    if(!name){
      if(row.some(v=>String(v==null?'':v).trim()!==''))errors.push(`第 ${i+1} 行：缺少业务名称，已跳过`);
      continue;
    }
    const catRaw=get('category');
    let category='';
    if(/福利|welfare/i.test(catRaw))category='welfare';
    else if(/凑单|消费|consume/i.test(catRaw))category='consume';
    if(!category){errors.push(`第 ${i+1} 行「${name}」：业务类别无法识别（${catRaw||'空'}），已跳过`);continue}
    const price=toNum(get('price'));
    if(price==null||price<0){errors.push(`第 ${i+1} 行「${name}」：资费价格不是有效数字，已跳过`);continue}
    const wool=toNum(get('wool'));
    if(wool!=null&&wool<0){errors.push(`第 ${i+1} 行「${name}」：羊毛不能为负数，已跳过`);continue}
    const start=toDate(get('start')),end=toDate(get('end'));
    if(start&&end&&start>end){errors.push(`第 ${i+1} 行「${name}」：开始日期晚于结束日期，已跳过`);continue}
    records.push({
      name,code,category,seriesName:get('series'),price,wool:wool==null?0:wool,
      startDate:start,endDate:end,liability:get('liability'),
      condAvg:/6/.test(get('cond'))?'avg6':'avg3',
      active:parseStatus(get('status'))
    });
  }
  return {records,errors,headerRow:headerRow+1};
}
/* ---- 导入计划：预览与实际导入共用同一份计算，保证数量一致 ---- */
function cleanName(s){return String(s==null?'':s).replace(/[\u200B-\u200D\uFEFF]/g,'').trim()}
function avatarHTML(name){
  const s=cleanName(name).slice(0,4);
  const lines=[];
  for(let i=0;i<s.length;i+=2)lines.push(escapeHtml(s.slice(i,i+2)));
  return lines.join('<br>')||'—';
}
// 返回：业务新增/更新条数；识别到的系列总数；其中新建 / 复用（含名称）；需自动创建的规则数
function planImport(records){
  const idByName=new Map();
  series.forEach(s=>{if(!idByName.has(s.name))idByName.set(s.name,s.id)});
  const newNames=[],reused=[];
  const seen=new Set();
  let add=0,update=0,rulesToAdd=0;
  records.forEach(r=>{
    const sname=cleanName(r.seriesName);
    let sid;
    if(!sname){
      sid=DEFAULT_SERIES;
      if(!seen.has('默认系列')){seen.add('默认系列');reused.push('默认系列')}
    }else if(idByName.has(sname)){
      sid=idByName.get(sname);
      if(!seen.has(sname)){seen.add(sname);reused.push(sname)}
    }else{
      sid='NEW:'+sname; // 本次新建系列（临时标识，导入时分配真实 id）
      if(!seen.has(sname)){seen.add(sname);newNames.push(sname)}
    }
    // 优先按业务编码匹配；无编码时退回同名同系列
    const exist=r.code?items.some(x=>x.code===r.code):items.some(x=>x.name===r.name&&seriesOf(x)===sid);
    exist?update++:add++;
    // 编码不在规则表 → 需自动创建外部规则
    if(r.code&&!ruleMap.has(r.code))rulesToAdd++;
  });
  return {add,update,seriesTotal:reused.length+newNames.length,newNames,reused,rulesToAdd};
}
function applyImport(records,plan){
  const now=Date.now();
  const idByName=new Map();
  series.forEach(s=>{if(!idByName.has(s.name))idByName.set(s.name,s.id)});
  // 先按计划建好所有新系列，业务再统一挂载
  let created=0;
  (plan&&plan.newNames?plan.newNames:[]).forEach((name,i)=>{
    if(idByName.has(name))return;
    const sid='s'+now+i+Math.random().toString(36).slice(2,6);
    series.push({id:sid,name,createdAt:now,updatedAt:now});
    idByName.set(name,sid);
    created++;
  });
  let added=0,updated=0;
  records.forEach((r,i)=>{
    const sname=cleanName(r.seriesName);
    let sid;
    if(!sname)sid=DEFAULT_SERIES;
    else if(idByName.has(sname))sid=idByName.get(sname);
    else{
      sid='s'+now+i+Math.random().toString(36).slice(2,6);
      series.push({id:sid,name:sname,createdAt:now,updatedAt:now});
      idByName.set(sname,sid);
      created++;
    }
    const data={
      name:r.name,category:r.category,type:r.category,price:r.price,wool:r.wool,
      startDate:r.startDate,endDate:r.endDate,liability:r.liability,active:r.active,seriesId:sid
    };
    if(r.category==='welfare')data.condAvg=r.condAvg||'avg3';
    if(r.code)data.code=r.code;
    const exist=r.code?items.find(x=>x.code===r.code):items.find(x=>x.name===r.name&&seriesOf(x)===sid);
    if(exist){
      Object.assign(exist,data,{updatedAt:now});
      // 以文件为准：未开通视为手动关闭（防日期自动开通），开通则解除标记
      if(data.active)delete exist.manualOff;
      else exist.manualOff=true;
      updated++;
    }
    else{
      items.push({id:'b'+now+i+Math.random().toString(36).slice(2,6),...data,createdAt:now,updatedAt:now});
      added++;
    }
  });
  // 业务编码不在规则表 → 自动创建「用户添加」规则（默认归入该业务所在系列，rules 页可筛选/修正）
  let rulesAdded=0;
  if(records.some(r=>r.code&&!ruleMap.has(r.code))){
    let rulesArr=[];
    try{rulesArr=JSON.parse(localStorage.getItem(KEY_R)||'[]')}catch(e){}
    if(!Array.isArray(rulesArr))rulesArr=[];
    const known=new Set(rulesArr.map(x=>x&&cleanName(x.code)).filter(Boolean));
    records.forEach((r,i)=>{
      if(!r.code||known.has(r.code))return;
      const item=items.find(x=>x.code===r.code);
      rulesArr.push({
        id:'r'+now+i+Math.random().toString(36).slice(2,6),
        code:r.code,shortName:'',name:r.name,
        seriesId:item?item.seriesId:DEFAULT_SERIES,
        category:r.category,condAvg:r.category==='welfare'?(r.condAvg==='avg6'?'avg6':'avg3'):undefined,
        price:r.price!=null?r.price:null,
        liability:r.liability||'',
        external:true,createdAt:now,updatedAt:now
      });
      known.add(r.code);
      rulesAdded++;
    });
    try{localStorage.setItem(KEY_R,JSON.stringify(rulesArr))}catch(e){}
  }
  persistSeries();persist(); // 先落盘，避免 load() 从存储重载丢失本次新建的系列/业务
  load(); // 重新载入规则表（含新增的外部规则）并同步定义字段
  const prevActive=new Set(items.filter(x=>x&&x.active).map(x=>x.id));
  applyDateStates();
  const off=enforceSeriesExclusive(null,prevActive);
  persist();render();
  return {added,updated,seriesAdded:created,rulesAdded,closed:off.length};
}

/* ---- 导入流程 ---- */
async function handleImportFile(file){
  if(!/\.xlsx$/i.test(file.name)){
    showInfo('格式不支持','仅支持 .xlsx 格式的 Excel 文件（.xls / .csv 请先另存为 .xlsx）。');
    return;
  }
  let rows;
  try{
    rows=await readXlsx(await file.arrayBuffer());
  }catch(err){
    showInfo('导入失败',(err&&err.message)||'无法解析该文件，请确认它是有效的 .xlsx 文件。');
    return;
  }
  let parsed;
  try{parsed=mapImportRows(rows)}catch(err){showInfo('导入失败',err.message);return}
  if(!parsed.records.length){
    showInfo('没有可导入的数据',parsed.errors.length?parsed.errors.slice(0,10).join('\n'):'表格里没有有效的业务数据行。');
    return;
  }
  const plan=planImport(parsed.records);
  const nameList=(arr,max)=>arr.length>max?arr.slice(0,max).join('、')+` 等 ${arr.length} 个`:arr.join('、');
  const msg=[
    `文件：${file.name}`,
    `识别到 ${parsed.records.length} 条业务、${plan.seriesTotal} 个资费系列。`,
    `业务：新增 ${plan.add} 条，更新 ${plan.update} 条。`,
    plan.rulesToAdd?`其中 ${plan.rulesToAdd} 条业务的编码不在资费规则表，将自动补充进规则表（标注为「用户添加」）。`:'',
    plan.newNames.length
      ?`系列：新建 ${plan.newNames.length} 个（${nameList(plan.newNames,4)}），复用 ${plan.reused.length} 个。`
      :`系列：${plan.seriesTotal} 个均已存在，直接复用。`,
    '同名且同系列的业务按表格内容更新，其余新增。',
    parsed.errors.length?`另有 ${parsed.errors.length} 行不符合要求，将被跳过。`:''
  ].filter(Boolean).join('\n');
  askConfirm(msg,()=>{
    const res=applyImport(parsed.records,plan);
    const lines=[`新增 ${res.added} 条业务，更新 ${res.updated} 条${res.seriesAdded?`；新建资费系列 ${res.seriesAdded} 个（${nameList(plan.newNames,4)}）`:''}。`];
    if(res.rulesAdded)lines.push(`资费规则表自动新增 ${res.rulesAdded} 条（用户添加），可在资费规则页查看、筛选与修正。`);
    if(res.closed)lines.push(`同系列业务互斥，已自动关闭 ${res.closed} 条重复开通的业务。`);
    if(parsed.errors.length)lines.push(`跳过 ${parsed.errors.length} 行：\n${parsed.errors.slice(0,5).join('\n')}${parsed.errors.length>5?'\n…':''}`);
    showInfo('导入完成',lines.join('\n'));
  },{title:'导入确认',okText:'导入',okClass:''});
}
$('exportBtn').addEventListener('click',exportXlsx);
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(file)handleImportFile(file);
});

readIdentity();
if(curPhone){migrateLegacy();load();render();}
bindPager($('pager'));
bindPager($('pickPager'));
// 页面长时间打开跨月时，重新按当前日期校正开通状态
function refreshDateStates(){
  const prevActive=new Set(items.filter(x=>x&&x.active).map(x=>x.id));
  const a=applyDateStates();
  const off=enforceSeriesExclusive(null,prevActive);
  if(a||off.length){persist();render()}
}
window.addEventListener('pageshow',refreshDateStates);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDateStates()});
</script>
