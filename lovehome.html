<script data-page-node-id="l0WngAtBwQ21h7VG8GeuMr" data-pnid-children="qz5ZcPbkEpHzdda9LhUGrc">
/* ============ 档位：59~369 共 32 档，每档 +10（正式口径） ============ */
const TIERS=Array.from({length:32},(_,i)=>59+i*10);
// 进度条刻度：每 5 档标一个（50 元间隔），页面放不下 32 个数字
const TICKS=TIERS.filter((_,i)=>i%5===0);

const KEY='arpu_lovehome_v1';
const pad=n=>String(n).padStart(2,'0');
function currentMonth(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function monthOf(s){return s?String(s).slice(0,7):''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtNum(v){return String(Math.round(v*100)/100)}
function money2(v){return Number(v||0).toFixed(2)}
function sanitizeNum(v){
  let s=String(v==null?'':v).replace(/[^\d.]/g,'');
  const i=s.indexOf('.');
  if(i!==-1)s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,'');
  const m=s.match(/^\d*(\.\d{0,2})?/);
  return m?m[0]:'';
}
// 算式：支持 + - * / 括号，失焦/回车时求值
function evalExpr(raw){
  let s=String(raw==null?'':raw).replace(/[＝]/g,'=').replace(/[＋]/g,'+').replace(/[－]/g,'-').replace(/[×✕]/g,'*').replace(/[÷]/g,'/').replace(/[=]+$/,'').trim();
  if(!s||!/^[\d+\-*/().\s]+$/.test(s))return null;
  try{const v=Function('"use strict";return('+s+')')();if(Number.isFinite(v)&&v>=0)return v}catch(e){}
  return null;
}

/* ============ 业务数据（按手机号分桶读取，只读不改） ============ */
function bizId(x){return String((x&&(x.id||x.name))||'')}
function bizCat(x){return x?(x.category||x.type||''):''}
function rulesMap(){
  const m=new Map();
  try{const a=JSON.parse(localStorage.getItem('arpu_rules_v1')||'[]');if(Array.isArray(a))a.forEach(r=>{if(r&&r.code)m.set(String(r.code).trim(),r)})}catch(e){}
  return m;
}
// 合约消费金额：记录里的 contract 为准，老数据用规则表同编码资费兜底
function contractOf(x,rules){
  if(!x)return 0;
  if(x.contract!==undefined&&x.contract!==null&&x.contract!==''){
    const v=Math.round(Number(x.contract)*100)/100;
    if(Number.isFinite(v)&&v>=0)return v;
  }
  const r=rules&&x.code?rules.get(String(x.code).trim()):null;
  const p=r&&r.price!=null?Number(r.price):Number(x.price);
  return Number.isFinite(p)&&p>=0?Math.round(p*100)/100:0;
}
// 业务在指定年月是否有效：到期月整月有效，次月起失效
function bizInMonth(x,ym){
  if(!x)return false;
  const s=x.startDate?String(x.startDate):'',e=x.endDate?String(x.endDate):'';
  if(!s&&!e)return true;
  const m=ym||currentMonth();
  if(s&&m<monthOf(s))return false;
  if(e&&m>monthOf(e))return false;
  return true;
}
function loadBizFor(phone){
  if(!/^1[3-9]\d{9}$/.test(phone||''))return [];
  let arr=[];
  try{
    const m=JSON.parse(localStorage.getItem('arpu_business_v2')||'{}');
    const b=(m&&typeof m==='object'&&!Array.isArray(m))?m[phone]:null;
    arr=Array.isArray(b)?b:[];
  }catch(e){arr=[]}
  const t=todayStr(),rules=rulesMap();
  return arr.filter(x=>x&&typeof x==='object').map(x=>{
    const s=x.startDate?String(x.startDate):'',e=x.endDate?String(x.endDate):'';
    const r=x.code?rules.get(String(x.code).trim()):null;
    const multi=r&&r.multi!==undefined?!!r.multi:!!x.multi;
    if(!s&&!e)return {...x,multi};
    if(x.manualOff)return {...x,multi,active:!!x.active};
    return {...x,multi,active:(!s||t>=s)&&(!e||monthOf(t)<=monthOf(e))};
  });
}
function activeConsume(phone,ym){
  return loadBizFor(phone).filter(x=>bizCat(x)==='consume'&&x.active&&bizInMonth(x,ym));
}
function initCounts(phone){
  const c={};
  activeConsume(phone,currentMonth()).forEach(x=>{c[bizId(x)]=1});
  return c;
}

/* ============ 组合状态 ============ */
let uid=0;
let members=[];
function newMember(){return {uid:++uid,phone:'',counts:{},manual:'',a6:null}}

/* ============ 近6月平均消费：接口自动带出（只读） ============ */
const UPSTREAM='http://ysmapp.bj.10086.cn/app/channel-web/busiCore/customerValidateAndConsumption.action';
const PROXY='https://arpu.151365.cc/api/query?url=';
const API_PARAMS={submitWarePackageId:'A1000529',submitChannel:'app_share',submitCode:'WWFSX001570',submitEmpCode:'WWFSX001570',nbc:'ddf05d72a82e5df6698124e53faf3fb9'};
function buildQueryUrl(phone){
  const q=new URLSearchParams({submitPhoneNO:phone,...API_PARAMS});
  return UPSTREAM+'?'+q.toString();
}
function monthAdd(ym,n){const [y,m]=ym.split('-').map(Number);const t=y*12+(m-1)+n;return `${Math.floor(t/12)}-${pad(t%12+1)}`}
// 校验接口返回并取出近6月平均（arpu_avg6）；失败返回 null
function normalizeAvg6(raw){
  if(!raw||typeof raw!=='object'||raw.errorCode!=='success')return null;
  let ent=raw.entity;
  if(typeof ent==='string'){try{ent=JSON.parse(ent)}catch(e){}}
  if(!ent||typeof ent!=='object')return null;
  const v=ent.arpu_avg6;
  if(v===null||v===undefined||v==='')return null;
  const n=Number(v);
  return Number.isFinite(n)&&n>=0?n:null;
}
const a6Timers={};
function scheduleA6(row){
  clearTimeout(a6Timers[row.uid]);
  a6Timers[row.uid]=setTimeout(()=>{if(validPhone(row.phone))queryA6(row)},600);
}
function queryA6(row){
  const phone=row.phone;
  if(!validPhone(phone))return;
  row.a6Loading=true;paintA6(row);paintA6Sum();
  const req=typeof fetch==='function'
    ?fetch(PROXY+encodeURIComponent(buildQueryUrl(phone)),{method:'GET',cache:'no-store'})
    :Promise.reject(new Error('no fetch'));
  req
    .then(res=>{if(!res.ok)throw new Error('query failed');return res.json()})
    .then(raw=>{
      if(row.phone!==phone)return; // 号码已改，丢弃过期结果
      row.a6=normalizeAvg6(raw);
    })
    .catch(()=>{
      if(row.phone!==phone)return;
      row.a6=null;
    })
    .finally(()=>{
      if(row.phone!==phone)return;
      row.a6Loading=false;
      paintA6(row);paintA6Sum();save();
    });
}
// 刷新所有有效号码的近6月均消（打开页面时调用，错开请求）
function refreshAllA6(){
  members.filter(r=>validPhone(r.phone)).forEach((r,i)=>setTimeout(()=>queryA6(r),i*400));
}

function validPhone(p){return /^1[3-9]\d{9}$/.test(p||'')}
function rowAutoSum(row){
  if(!validPhone(row.phone))return 0;
  const biz=loadBizFor(row.phone),rules=rulesMap(),ym=currentMonth();
  let s=0;
  Object.keys(row.counts||{}).forEach(id=>{
    const n=row.counts[id];if(!n)return;
    const x=biz.find(b=>bizId(b)===id);
    if(x&&bizInMonth(x,ym))s+=contractOf(x,rules)*n;
  });
  return s;
}
function rowValue(row){
  if(row.manual!==''){const n=Number(row.manual);return Number.isFinite(n)&&n>=0?n:null}
  if(!validPhone(row.phone))return null;
  return rowAutoSum(row);
}
function consDisplay(row){
  if(row.manual!=='')return row.manual;
  if(!validPhone(row.phone))return '';
  const s=rowAutoSum(row);
  return s>0?fmtNum(s):'';
}

function save(){
  try{
    const data={members:members.map(m=>({phone:m.phone,counts:m.counts,manual:m.manual,a6:typeof m.a6==='number'?m.a6:null})),updatedAt:Date.now()};
    localStorage.setItem(KEY,JSON.stringify(data));
  }catch(e){}
}
function loadState(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){s=null}
  if(s&&Array.isArray(s.members)&&s.members.length){
    members=s.members.slice(0,4).map(m=>{
      const row=newMember();
      row.phone=validPhone(m&&m.phone)?m.phone:'';
      row.counts=(m&&m.counts&&typeof m.counts==='object'&&!Array.isArray(m.counts))?{...m.counts}:{};
      row.manual=m&&typeof m.manual==='string'?m.manual:'';
      row.a6=m&&typeof m.a6==='number'&&Number.isFinite(m.a6)&&m.a6>=0?m.a6:null;
      return row;
    });
  }
  if(!members.length)members=[newMember()];
}

/* ============ 渲染 ============ */
const listEl=document.getElementById('memberList');
function renderCards(){
  listEl.innerHTML=members.map((r,i)=>`
  <div class="mcard" data-uid="${r.uid}">
    <div class="mhead">
      <span class="mno">号码 ${i+1}</span>
      <input class="phone" data-phone="${r.uid}" type="tel" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="请输入 11 位手机号" value="${esc(r.phone)}">
      <span class="a6-pill" data-a6="${r.uid}" title="近6月平均消费（自动查询，不可修改）"></span>
      ${members.length>1?`<button class="mdel" data-del="${r.uid}" type="button" aria-label="删除号码 ${i+1}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>`:''}
    </div>
    <div class="cons-row">
      <div class="cons-wrap">
        <input class="plan-field p-cons" data-cons="${r.uid}" type="text" inputmode="text" autocomplete="off" placeholder="选择业务自动计算，或手动输入本月消费" value="${esc(consDisplay(r))}">
        <button class="cons-menu" data-menu="${r.uid}" type="button" aria-label="选择凑单业务" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <div class="cons-tags" data-tags="${r.uid}"></div>
      <div class="cons-dd hidden" data-dd="${r.uid}"></div>
    </div>
    <div class="mhint" data-hint="${r.uid}"></div>
  </div>`).join('');
  members.forEach(r=>{
    r.el={
      phone:listEl.querySelector(`[data-phone="${r.uid}"]`),
      cons:listEl.querySelector(`[data-cons="${r.uid}"]`),
      tags:listEl.querySelector(`[data-tags="${r.uid}"]`),
      dd:listEl.querySelector(`[data-dd="${r.uid}"]`),
      hint:listEl.querySelector(`[data-hint="${r.uid}"]`),
      menu:listEl.querySelector(`[data-menu="${r.uid}"]`),
      a6:listEl.querySelector(`[data-a6="${r.uid}"]`)
    };
    bindPhone(r);
    bindCons(r);
    paintA6(r);
  });
  document.getElementById('addBtn').disabled=members.length>=4;
  document.getElementById('addBtn').textContent=members.length>=4?'最多 4 个手机号':'＋ 添加手机号';
  recalc();
  paintA6Sum();
}
function rowByUid(u){return members.find(r=>r.uid===Number(u))}

/* ============ 近6月均消展示（只读） ============ */
function a6Text(row){
  if(!validPhone(row.phone))return '';
  if(row.a6Loading)return '近6月均消 <b>…</b>';
  return row.a6!=null?`近6月均消 <b>¥${Math.round(row.a6)}</b>`:'近6月均消 <b>—</b>';
}
function paintA6(row){
  if(!row.el||!row.el.a6)return;
  row.el.a6.innerHTML=a6Text(row);
  row.el.a6.classList.toggle('loading',!!row.a6Loading||row.a6==null);
  row.el.a6.style.display=validPhone(row.phone)?'':'none';
}
// 合计卡右侧：所有有效号码近6月均消的合计值（忽略查询失败/查询中的号码，一个都没有则 —）
function paintA6Sum(){
  const el=document.getElementById('a6Avg');
  if(!el)return;
  const vals=members.filter(r=>validPhone(r.phone)&&typeof r.a6==='number').map(r=>r.a6);
  if(!vals.length){el.innerHTML='—';el.classList.add('loading');return}
  const sum=vals.reduce((s,v)=>s+v,0);
  el.classList.remove('loading');
  el.innerHTML=`<span class="cur">¥</span>${Math.round(sum*100)/100}`;
}

function bindPhone(row){
  const el=row.el.phone;
  if(!el)return;
  el.addEventListener('input',()=>{
    let v=el.value.replace(/\D/g,'').slice(0,11);
    if(v!==el.value)el.value=v;
    if(v===row.phone){save();return}
    row.phone=v;
    // 换号后业务桶、次数、手填值、近6月均消都要按新号码重来
    row.counts=validPhone(v)?initCounts(v):{};
    row.manual='';
    row.a6=null;
    if(row.el)row.el.cons.value='';
    recalc();paintA6(row);paintA6Sum();save();
    clearTimeout(a6Timers[row.uid]);
    if(validPhone(v))scheduleA6(row);
  });
}
function bindCons(row){
  const el=row.el.cons;
  if(!el)return;
  el.addEventListener('input',()=>{
    const t=el.value;
    // 纯数字即时联动；含运算符的算式先不动合计，等失焦/回车再求值（与 index 一致）
    if(/^\d*\.?\d*$/.test(t.trim())){row.manual=t;recalc()}
    save();
  });
  const apply=()=>{
    const t=el.value.trim();
    if(t===''){row.manual='';recalc();save();return}
    const v=evalExpr(t);
    if(v==null){
      // 非法输入：回到上一次有效值（手填或自动合计）
      el.value=consDisplay(row);
    }else{
      el.value=fmtNum(v);
      row.manual=el.value;
    }
    recalc();save();
  };
  el.addEventListener('blur',apply);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();apply();el.blur()}});
}

/* ============ 业务标签 / 下拉 ============ */
function renderTags(row){
  const box=row.el&&row.el.tags;
  if(!box)return;
  if(!validPhone(row.phone)||!row.counts){box.innerHTML='';return}
  const biz=loadBizFor(row.phone),rules=rulesMap(),ym=currentMonth();
  const ids=Object.keys(row.counts).filter(id=>{
    if(!(row.counts[id]>0))return false;
    const x=biz.find(b=>bizId(b)===id);
    return !!x&&bizInMonth(x,ym);
  });
  box.innerHTML=ids.map(id=>{
    const x=biz.find(b=>bizId(b)===id),n=row.counts[id];
    const nm=esc(x?x.name||'':id),cp=contractOf(x,rules);
    // 多次订购=否：只能订一次，点击标签整体开通/取消
    if(x&&!x.multi)return `<span class="ctag single" data-id="${esc(id)}" data-uid="${row.uid}"><span class="sw-bar"><button class="sw-btn" data-dec="${esc(id)}" data-uid="${row.uid}" aria-label="删除该业务" tabindex="-1">−</button><span class="sw-mid">${nm}<b class="cam">¥${Number(cp).toFixed(2)}</b></span><button class="sw-btn" data-inc="${esc(id)}" data-uid="${row.uid}" aria-label="多次订购=否，不可增加" tabindex="-1" disabled>＋</button></span></span>`;
    return `<span class="ctag" data-id="${esc(id)}" data-uid="${row.uid}"><span class="sw-bar"><button class="sw-btn" data-dec="${esc(id)}" data-uid="${row.uid}" aria-label="减少一次" tabindex="-1">−</button><span class="sw-mid">${nm}<b class="cam">¥${Number(cp).toFixed(2)}</b></span><button class="sw-btn" data-inc="${esc(id)}" data-uid="${row.uid}" aria-label="增加一次" tabindex="-1">＋</button></span>${n>1?`<span class="led on">${n}</span>`:''}</span>`;
  }).join('');
}
function rowSeriesOwned(row){
  const biz=loadBizFor(row.phone),own={};
  Object.keys(row.counts||{}).forEach(id=>{
    if(!(row.counts[id]>0))return;
    const x=biz.find(b=>bizId(b)===id);
    if(!x)return;
    const sid=x.seriesId||'default';
    if(sid!=='default')own[sid]=String(x.name||'');
  });
  return own;
}
function showDropdown(row){
  const dd=row.el&&row.el.dd;
  if(!dd)return;
  hideDropdowns();
  if(!validPhone(row.phone)){
    dd.innerHTML='<div class="dd-empty">请先填写合法的手机号</div>';
    dd.classList.remove('hidden');setMenu(row,true);return;
  }
  const ym=currentMonth();
  const cands=loadBizFor(row.phone).filter(x=>bizCat(x)==='consume'&&bizInMonth(x,ym)&&!(row.counts&&row.counts[bizId(x)]>0));
  if(!cands.length){
    dd.innerHTML='<div class="dd-empty">该号码没有可添加的消费凑单业务</div>';
    dd.classList.remove('hidden');setMenu(row,true);return;
  }
  const owned=rowSeriesOwned(row),rules=rulesMap();
  dd.innerHTML=cands.map(x=>{
    const sid=x.seriesId||'default';
    const conflict=sid==='default'?'':owned[sid];
    const cp=contractOf(x,rules);
    return `<div class="dd-item${conflict?' swap':''}" data-add="${esc(bizId(x))}" data-uid="${row.uid}"${conflict?` title="选择后替换同系列原业务「${esc(conflict)}」"`:''}><span>${esc(x.name||'')}<b class="cam">¥${Number(cp).toFixed(2)}</b></span>${conflict?`<span class="dd-tip">变更自「${esc(conflict)}」</span>`:''}</div>`;
  }).join('');
  dd.classList.remove('hidden');
  setMenu(row,true);
}
function hideDropdowns(){
  document.querySelectorAll('.cons-dd').forEach(dd=>dd.classList.add('hidden'));
  document.querySelectorAll('.cons-menu.on').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-expanded','false')});
}
function setMenu(row,on){
  if(!row.el||!row.el.menu)return;
  row.el.menu.classList.toggle('on',on);
  row.el.menu.setAttribute('aria-expanded',on?'true':'false');
}
function addConsume(row,id){
  if(!row||!validPhone(row.phone))return;
  const biz=loadBizFor(row.phone),x=biz.find(b=>bizId(b)===id);
  if(!x)return;
  row.counts=row.counts||{};
  if(!x.multi&&(row.counts[id]||0)>=1)return;
  const sid=x.seriesId||'default';
  const price=contractOf(x,rulesMap());
  let times=1,removedPrice=0;
  // 同一自定义系列互斥：视为业务变更，替换原业务并沿用开通次数
  if(sid!=='default'&&(row.counts[id]||0)<=0){
    let old=0;
    Object.keys(row.counts).forEach(cid=>{
      const n=row.counts[cid];if(!n)return;
      const y=biz.find(b=>bizId(b)===cid);
      if(!y||(y.seriesId||'default')!==sid)return;
      old+=n;removedPrice+=contractOf(y,rulesMap())*n;row.counts[cid]=0;
    });
    if(old)times=old;
  }
  row.counts[id]=(row.counts[id]||0)+times;
  // 手填过金额：按业务资费增减，保持用户手填口径
  if(row.manual!==''){
    const cur=Number(row.manual);
    if(Number.isFinite(cur)){
      row.manual=fmtNum(Math.max(0,cur+price*times-removedPrice));
      if(row.el)row.el.cons.value=row.manual;
    }
  }
  hideDropdowns();recalc();save();
}
function removeConsume(row,id){
  if(!row||!row.counts)return;
  const n=row.counts[id]||0;
  if(n<=0)return;
  const x=loadBizFor(row.phone).find(b=>bizId(b)===id);
  row.counts[id]=n-1;
  if(row.manual!==''&&x){
    const cur=Number(row.manual);
    if(Number.isFinite(cur)){
      row.manual=fmtNum(Math.max(0,cur-contractOf(x,rulesMap())));
      if(row.el)row.el.cons.value=row.manual;
    }
  }
  recalc();save();
}

/* ============ 计算与档位 ============ */
function recalc(){
  let total=0,count=0;
  members.forEach(row=>{
    const auto=row.manual==='';
    const sum=auto&&validPhone(row.phone)?rowAutoSum(row):null;
    // 自动口径：输入框显示业务合计（0 则留空），但不覆盖正在输入的框
    if(auto&&row.el&&document.activeElement!==row.el.cons){
      row.el.cons.value=sum>0?fmtNum(sum):'';
    }
    const v=rowValue(row);
    if(v!=null)total+=v;
    if(validPhone(row.phone))count++;
    renderTags(row);
    if(row.el&&row.el.hint)row.el.hint.innerHTML=hintText(row,sum);
  });
  paintTotal(total,count);
}
function hintText(row,sum){
  if(!validPhone(row.phone))return '填写手机号后自动带出该号码的凑单业务；也可以直接手填本月消费。';
  const n=activeConsume(row.phone,currentMonth()).length;
  if(!n)return '该号码在业务管理里还没有消费凑单业务，可直接手填本月消费。';
  if(row.manual!=='')return `已开通凑单业务 ${n} 项，当前为手动金额；点右侧菜单可继续添加业务。`;
  const hasMulti=activeConsume(row.phone,currentMonth()).some(x=>x.multi);
  return hasMulti
    ? `已开通凑单业务 ${n} 项，自动合计 <b>¥${money2(sum)}</b>；按 − / ＋ 调整订购次数。`
    : `已开通凑单业务 ${n} 项，自动合计 <b>¥${money2(sum)}</b>；点击标签可开通/取消。`;
}
function paintTotal(total,count){
  const s=money2(total);
  const tv=document.getElementById('totalVal');
  tv.textContent=s;
  // 字号恒定不缩小；仅当数字过长、与右侧均消块距离不足 50px 时兜底缩字号，保证不覆盖右侧内容
  const totalEl=tv.closest('.total');
  totalEl.style.fontSize='';
  const rightEl=document.querySelector('.total-right');
  let fs=parseFloat(getComputedStyle(totalEl).fontSize),guard=0;
  while(guard++<8&&rightEl&&rightEl.getBoundingClientRect().left-tv.getBoundingClientRect().right<50){
    fs=Math.max(20,fs-4);
    totalEl.style.fontSize=fs+'px';
  }
  const tierLabel=t=>`${t} 元档`;
  const reached=TIERS.filter(t=>total>=t).pop()||null;
  const next=TIERS.find(t=>total<t)||null;
  const sub=document.getElementById('totalSub');
  const cn=count==null?members.filter(r=>validPhone(r.phone)).length:count;
  let txt=[];
  if(cn)txt.push(`共 ${cn} 个号码`);
  if(reached)txt.push(`已达成 <b>${tierLabel(reached)}</b>`);
  if(next)txt.push(`${reached?'距':'距首个档位'} <b>${tierLabel(next)}</b> 还差 <b>¥${money2(next-total)}</b>`);
  else if(reached)txt.push('已超过最高档位');
  if(!txt.length)txt.push('填写手机号并计算当月消费');
  sub.innerHTML=txt.join(' · ');

  const max=TIERS[TIERS.length-1];
  document.getElementById('progBar').style.width=Math.min(100,total/max*100)+'%';
  document.getElementById('ticks').innerHTML=TICKS.map(t=>{
    const left=Math.min(100,t/max*100);
    const style=left>=100?'right:0;transform:none':`left:${left}%`;
    return `<span class="${total>=t?'done':''}" style="${style}">${t}</span>`;
  }).join('');
}

/* ============ 事件 ============ */
listEl.addEventListener('pointerdown',e=>{
  const it=e.target.closest('[data-add]');
  if(it){e.preventDefault();addConsume(rowByUid(it.dataset.uid),it.dataset.add);return}
});
listEl.addEventListener('click',e=>{
  const del=e.target.closest('[data-del]');
  if(del){
    const row=rowByUid(del.dataset.del);
    members=members.filter(r=>r!==row);
    if(!members.length)members=[newMember()];
    renderCards();save();return;
  }
  const menu=e.target.closest('.cons-menu');
  if(menu){
    const row=rowByUid(menu.dataset.menu);
    if(row.el.dd.classList.contains('hidden'))showDropdown(row);else hideDropdowns();
    return;
  }
  // 多次订购=否的业务同样渲染 −/＋（＋禁用），删除走 data-dec，无整体切换分支
  const dec=e.target.closest('[data-dec]');
  if(dec){removeConsume(rowByUid(dec.dataset.uid),dec.dataset.dec);return}
  const inc=e.target.closest('[data-inc]');
  if(inc){addConsume(rowByUid(inc.dataset.uid),inc.dataset.inc);return}
  const mid=e.target.closest('.sw-mid');
  if(mid){
    const tag=mid.closest('.ctag');
    addConsume(rowByUid(tag.dataset.uid),tag.dataset.id);return;
  }
});
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.cons-dd')&&!e.target.closest('.cons-wrap'))hideDropdowns();
});
document.getElementById('addBtn').addEventListener('click',()=>{
  if(members.length>=4)return;
  members.unshift(newMember());
  renderCards();save();
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!confirm('确定清空当前组合吗？'))return;
  members=[newMember()];
  renderCards();save();
});
// 其他标签页改了业务数据，回来时重算
window.addEventListener('storage',e=>{
  if(e.key==null||e.key==='arpu_business_v2'||e.key==='arpu_rules_v1'){
    members.forEach(r=>{if(validPhone(r.phone))r.counts={...initCounts(r.phone),...r.counts}});
    recalc();
  }
});
window.addEventListener('pageshow',()=>{applyIdentity();recalc()});

// 身份守卫：index 查询过合法手机号才可用；直接打开链接时只显示 denyView
let booted=false;
function applyIdentity(){
  let cur='';
  try{cur=localStorage.getItem('arpu_last_query')||''}catch(e){}
  const has=/^1[3-9]\d{9}$/.test(cur);
  document.body.classList.toggle('no-identity',!has);
  const dv=document.getElementById('denyView');
  if(dv)dv.style.display=has?'none':'flex';
  if(has&&!booted){
    booted=true;
    loadState();
    renderCards();
    refreshAllA6();
  }
}
applyIdentity();
